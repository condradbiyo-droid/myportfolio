<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biyo's Homepage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            background-image: url('10.webp');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-top: 20px; }
        .container {
            border: 5px solid red;
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            background-color: blue;
            border-radius: 10px;
        }
        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px;
        }
        .menu a {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            padding: 10px;
            background-color: #e0e0e0;
            border: 1px solid #000;
            border-radius: 5px;
            transition: background-color 0.3s;
            height: 80px;
            width: 100%;
            box-sizing: border-box;
        }
        .menu a:hover { background-color: purple; color: #fff; }
        .menu a.disabled {
            background-color: #ccc;
            color: #666;
            cursor: not-allowed;
            pointer-events: none;
        }
        /* GAME BUTTON STYLES */
        .game-btn {
            grid-column: span 2;
            background-color: #28a745;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
            border: 2px solid #1e7e34;
        }
        .game-btn:hover {
            background-color: #218838;
            color: white;
        }
        .yolo {
            font-size: 50px;
            font-weight: bold;
            margin-top: 30px;
            color: white;
            text-shadow: 2px 2px 4px #000;
        }
        .access-denied {
            color: red;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px;
            display: none;
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <h1>Biyo's Homepage</h1>
	<br>
	<br><br><br><br>

    <div id="accessMessage" class="access-denied">Sorry you cant access this site.</div>

    <div class="container">
        <h1>Hi! Im Condrad Lander Biyo</h1>
        <div class="menu">
            <a id="personalLink" href="personal.html">Personal Details</a>
            <a id="familyLink" href="family.html">Family Background</a>
            <a id="educationLink" href="education.html">Educational Background</a>
            <a id="collectionLink" href="collection.html">Collection Background</a>
            
            <!-- GAME BUTTON - NOT AFFECTED BY RESTRICTION -->
            <a id="gameLink" href="game.html" class="game-btn">🎮 Play Game</a>
        </div>
    </div>

    <div class="yolo">YOLO</div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            const loggedInUser = localStorage.getItem('loggedInUser');
            const accessMessage = document.getElementById('accessMessage');
            
            // Only these links are restricted
            const restrictedLinks = [
                document.getElementById('personalLink'),
                document.getElementById('familyLink'),
                document.getElementById('educationLink'),
                document.getElementById('collectionLink')
            ];

            if (loggedInUser === 'Condrad Lander Biyo') {
                accessMessage.style.display = 'none';
            } else {
                accessMessage.style.display = 'block';
                restrictedLinks.forEach(link => {
                    link.classList.add('disabled');
                    link.removeAttribute('href');
                });
                // gameLink is NOT in this list, so it stays active!
            }
        });
    </script>
</body>
</html>
